name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall already runs prisma generate.
      - run: npm ci

      # Applies the real migration history, so CI validates the same SQL that
      # production will run. `db push` validated a throwaway schema and never
      # caught drift against the live database.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # Fails if the migrated database does not match schema.prisma, which catches a
      # migration that silently did not apply. Prisma 7 removed --from-url, so
      # the "from" side comes from the datasource in prisma.config.ts.
      #
      # The pg_trgm index is created by hand-written SQL because Prisma cannot
      # express a GIN index with an operator class, so Prisma always reports it
      # as removable. That one statement is filtered out; anything else fails.
      - name: Verify no drift between the database and the schema
        run: |
          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script > /tmp/drift.sql || true
          awk 'BEGIN { RS=";" } /VerseSearch_textNormalized_trgm_idx/ { next } { print }' \
            /tmp/drift.sql | grep -vE '^[[:space:]]*(--|$)' > /tmp/drift-filtered.sql || true
          if [ -s /tmp/drift-filtered.sql ]; then
            echo "::error::Database does not match prisma/schema.prisma"
            cat /tmp/drift-filtered.sql
            exit 1
          fi
          echo "No unexpected drift."

      - run: npm run typecheck

      - run: npm run lint -- --max-warnings 0

      - run: npm test

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npx playwright install --with-deps chromium

      - name: Seed the auth fixture
        run: node scripts/auth-e2e.mjs

      - name: Run e2e suite
        run: npx playwright test e2e/auth.spec.ts --project=chromium
