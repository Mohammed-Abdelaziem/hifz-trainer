name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall already runs prisma generate.
      - run: npm ci

      # Applies the real migration history, so CI validates the same SQL that
      # production will run. `db push` validated a throwaway schema and never
      # caught drift against the live database.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # Fails if the migrated database does not match schema.prisma, which catches a
      # migration that silently did not apply. Prisma 7 removed --from-url, so
      # the "from" side comes from the datasource in prisma.config.ts.
      #
      # Prisma cannot express a GIN index with an operator class, so indexes
      # created by hand-written migration SQL are invisible to it and it always
      # reports them as removable. Add each one to MANAGED_BY_SQL below or this
      # check fails with a confusing "database does not match schema" error.
      - name: Verify no drift between the database and the schema
        run: |
          MANAGED_BY_SQL="VerseSearch_textNormalized_trgm_idx"

          npx prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --script > /tmp/drift.sql || true

          # Drop whole statements (records are ';'-delimited) that only touch a
          # hand-managed index. Note the (--|$) group: (|--|$) has an empty
          # alternative that matches every line and silently discards the diff.
          awk -v allow="$MANAGED_BY_SQL" \
            'BEGIN { RS=";" } $0 ~ allow { next } { print }' \
            /tmp/drift.sql \
            | grep -vE '^[[:space:]]*(--|$)' > /tmp/drift-filtered.sql || true

          if [ -s /tmp/drift-filtered.sql ]; then
            echo "::error::Database does not match prisma/schema.prisma"
            echo "If this is a hand-written index, add it to MANAGED_BY_SQL."
            cat /tmp/drift-filtered.sql
            exit 1
          fi
          echo "No unexpected drift."

      - run: npm run typecheck

      - run: npm run lint -- --max-warnings 0

      - run: npm test

      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # The suite itself runs in well under a minute; the budget is dominated by
    # npm ci, Playwright's browser download and the production build. 20 minutes
    # only ever masked a hang, which is how the original broken suite hid for
    # three runs.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
      # Every spec shares one IP and this server has no Upstash, so the
      # in-memory fallback would rate-limit the suite itself. See src/proxy.ts.
      RATE_LIMIT_BYPASS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma migrate deploy

      - run: npx playwright install --with-deps chromium

      - name: Seed the auth fixture
        run: node scripts/auth-e2e.mjs

      - name: Run e2e suite
        run: npm run e2e
